## Files and directories preserved across sysupgrade.

# Which services are enabled. OpenWrt stores that as symlinks here, and they
# are not part of the default keep list, so without this line everything the
# user enabled by hand comes back disabled after an upgrade.
#
# Note that this restores the union of the old and the new state: a service
# that the user disabled but that ships enabled in the new image will be
# enabled again.
/etc/rc.d/

# Says the secure defaults have already been applied on this router. Without it
# every upgrade looks like a fresh install and switches both radios off.
/etc/.be7000_secure_defaults
