name: Build EdgePi E87N firmware

on:
  workflow_dispatch:
  push:
    branches:
      - e87n
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: e87n-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            squashfs-tools swig unzip zlib1g-dev file wget

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Configure E87N target
        run: |
          cmp -s .config.e87n .config
          cp .config.e87n .config
          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_edgepi_e87n=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-openclash=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall=y$' .config
          grep -q '^CONFIG_PACKAGE_openclash-core-meta=y$' .config
          grep -q '^CONFIG_DISPLAY_SUPPORT=y$' .config
          grep -q '^CONFIG_PACKAGE_display=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-display=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-backlight-pwm=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-fb-tft-nv3007=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-offload=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nvme=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-hwmon-core=y$' .config

          # Linux 6.18 fb.ko calls the backlight core when FB_BACKLIGHT is enabled.
          # Keep the package dependency one-way to avoid kmod-fb/kmod-backlight cycles.
          grep -Fq 'DEPENDS:=@DISPLAY_SUPPORT +LINUX_6_12:kmod-fb' package/kernel/linux/modules/video.mk
          grep -Fq 'DEPENDS:=@DISPLAY_SUPPORT +LINUX_6_18:kmod-backlight' package/kernel/linux/modules/video.mk

          # E87N backlight is active-low: max raw brightness means fully off.
          grep -Fq 'max * (100 - percent)' package/luci-app-display/root/usr/sbin/display-control
          sed -n '/^turn_off()/,/^}/p' package/luci-app-display/root/usr/sbin/display-control |
            grep -Fq 'set_brightness "$max"'

          # The LuCI package controls the source-built binary; no stale prebuilt copy remains.
          test ! -e package/luci-app-display/root/usr/sbin/display
          grep -Fq '+luci-base +display' package/luci-app-display/Makefile
          grep -q '^PKG_SOURCE_VERSION:=857574ae02dc11943f99423419e71556775977bd$' package/display/Makefile
          grep -q '^PKG_HASH:=7d9704c4f9365ddfb59c383cf625c1acc9725bd4c20670926434fa1992d958ff$' package/display/Makefile
          grep -Fq 'strcmp(name, "nvme")' package/display/patches/010-e87n-cyberpunk-nvme.patch
          grep -Fq 'ui_Screen1_set_nvme_visibility' package/display/patches/010-e87n-cyberpunk-nvme.patch
          grep -Fq 'LV_CHART_TYPE_LINE' package/display/patches/010-e87n-cyberpunk-nvme.patch

      - name: Verify pinned package toolchains
        run: |
          grep -q '^GO_DEFAULT_VERSION:=1.26$' feeds/packages/lang/golang/golang-values.mk
          grep -q '^GO_VERSION_PATCH:=5$' feeds/packages/lang/golang/golang1.26/Makefile
          grep -q '^PKG_VERSION:=1.96.0$' feeds/packages/lang/rust/Makefile
          grep -q '^PKG_VERSION:=1.4.7$' feeds/packages/admin/btop/Makefile
          grep -q '^PKG_VERSION:=26.8.12$' feeds/passwall_luci/luci-app-passwall/Makefile
          grep -q '^PKG_VERSION:=0.47.156$' feeds/openclash/luci-app-openclash/Makefile

      - name: Download sources
        run: |
          make download -j8
          find dl -type f -size -1024c -print -delete
          make download -j8

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" V=s 2>&1 | tee build.log; then
            make -j1 V=s 2>&1 | tee build-j1.log
          fi

      - name: Verify kernel and firmware contents
        shell: bash
        run: |
          set -euxo pipefail
          image_dir='bin/targets/mediatek/filogic'
          sysupgrade="$(find "$image_dir" -maxdepth 1 -type f -name '*edgepi*e87n*squashfs-sysupgrade.bin' -print -quit)"
          initramfs="$(find "$image_dir" -maxdepth 1 -type f -name '*edgepi*e87n*initramfs*' -print -quit)"
          test -n "$sysupgrade" && test -s "$sysupgrade"
          test -n "$initramfs" && test -s "$initramfs"

          manifest="$(find "$image_dir" -maxdepth 1 -type f -name '*edgepi*e87n.manifest' -print -quit)"
          test -n "$manifest" && test -s "$manifest"
          grep -q '^display ' "$manifest"
          grep -q '^luci-app-display ' "$manifest"
          grep -q '^kmod-backlight-pwm ' "$manifest"
          grep -q '^kmod-fb-tft-nv3007 ' "$manifest"
          grep -q '^kmod-nvme ' "$manifest"
          grep -q '^kmod-hwmon-core ' "$manifest"
          grep -q '^kmod-nft-offload ' "$manifest"

          kernel_config="$(find build_dir/target-aarch64_cortex-a53_musl -path '*/linux-mediatek_filogic/linux-6.18*/.config' -print -quit)"
          test -n "$kernel_config"
          grep -q '^CONFIG_FB_TFT_NV3007=m$' "$kernel_config"
          grep -q '^CONFIG_HWMON=m$' "$kernel_config"
          grep -q '^CONFIG_NVME_HWMON=y$' "$kernel_config"
          grep -q '^CONFIG_NF_FLOW_TABLE_HW=m$' "$kernel_config"
          grep -q '^CONFIG_NET_MEDIATEK_SOC=y$' "$kernel_config"

          realtek_source="$(find build_dir/target-aarch64_cortex-a53_musl -path '*/linux-6.18*/drivers/net/phy/realtek/realtek_main.c' -print -quit)"
          test -n "$realtek_source"
          grep -q 'RTL8221B_LED_LINK_SELECT' "$realtek_source"

          work="$RUNNER_TEMP/e87n-verify"
          mkdir -p "$work/sysupgrade" "$work/rootfs"
          tar -xf "$sysupgrade" -C "$work/sysupgrade"
          rootfs="$(find "$work/sysupgrade" -type f -name root -print -quit)"
          test -n "$rootfs"
          unsquashfs -d "$work/rootfs" "$rootfs" >/dev/null

          test -x "$work/rootfs/usr/sbin/display"
          test -x "$work/rootfs/usr/sbin/display-control"
          test -x "$work/rootfs/etc/init.d/display-control"
          test -x "$work/rootfs/usr/bin/fancontrol"
          test -x "$work/rootfs/etc/init.d/fancontrol"
          test -x "$work/rootfs/etc/openclash/core/clash_meta"
          test -x "$work/rootfs/usr/bin/btop"
          test -d "$work/rootfs/usr/share/openclash"
          test -d "$work/rootfs/usr/share/passwall"
          test -f "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -q "192.168.66.1" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -q "flow_offloading_hw='1'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          find "$work/rootfs/lib/modules" -name 'fb_nv3007.ko' -print -quit | grep -q .
          find "$work/rootfs/lib/modules" -name 'hwmon.ko' -print -quit | grep -q .
          find "$work/rootfs/lib/modules" -name 'nvme-core.ko' -print -quit | grep -q .
          find "$work/rootfs/lib/modules" -name 'nf_flow_table.ko' -print -quit | grep -q .

          file "$work/rootfs/usr/sbin/display" | grep -q 'ARM aarch64'
          strings "$work/rootfs/usr/sbin/display" | grep -q 'NVME0_TEMP'
          strings "$work/rootfs/usr/sbin/display" | grep -q '/sys/class/hwmon'
          file "$work/rootfs/etc/openclash/core/clash_meta" | grep -q 'ARM aarch64'

          {
            echo "sysupgrade=$sysupgrade"
            echo "initramfs=$initramfs"
            echo 'go=1.26.5'
            echo 'rust=1.96.0'
            echo 'btop=1.4.7'
            echo 'passwall=26.8.12'
            echo 'openclash=0.47.156'
            echo 'mihomo=1.19.29'
            echo 'nvme_hwmon=CONFIG_NVME_HWMON=y'
            echo 'display_source=Hiveton/hiveton-mt-lvgl-c@857574ae02dc11943f99423419e71556775977bd'
            sha256sum "$sysupgrade" "$initramfs"
          } | tee "$image_dir/e87n-verification.txt"

      - name: Upload E87N firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgepi-e87n-firmware-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            bin/targets/mediatek/filogic/*edgepi*e87n*
            bin/targets/mediatek/filogic/e87n-verification.txt
            bin/targets/mediatek/filogic/sha256sums
            build.log
            build-j1.log
