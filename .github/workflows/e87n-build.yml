name: Build EdgePi E87N firmware

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e87n-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            squashfs-tools swig unzip zlib1g-dev file wget

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: |
          set -o pipefail
          grep -Eq '^[[:space:]]*src-git[[:space:]]+video([[:space:]]|$)' feeds.conf.default
          cp .config "$RUNNER_TEMP/e87n-config-before-feeds"
          ./scripts/feeds install -a 2>&1 | tee "$RUNNER_TEMP/e87n-feeds-install.log"
          cp "$RUNNER_TEMP/e87n-config-before-feeds" .config
          grep -Fq 'Preparing E87N feeds before installation.' scripts/feeds
          grep -Fq 'Running E87N feed cleanup after installation.' scripts/feeds
          grep -Fq 'next if $e87n_install_all && $e87n_skip->{$name};' scripts/feeds
          test -s scripts/e87n-unselected-feed-packages
          ! grep -Fq './scripts/feeds uninstall' scripts/e87n-prune-unselected-feeds.sh
          ! grep -Fq 'No feed for package' "$RUNNER_TEMP/e87n-feeds-install.log"
          ! grep -Fq 'which does not exist' "$RUNNER_TEMP/e87n-feeds-install.log"
          while read -r package; do
            test -n "$package" || continue
            for link in package/feeds/*/"$package"; do
              test ! -L "$link"
            done
          done < scripts/e87n-unselected-feed-packages
          for package in wayland mesa graphene sdl2-compat sdl3; do
            test -L "package/feeds/video/$package"
          done
          grep -Fq 'PKG_BUILD_DEPENDS:=wayland/host wayland wayland-protocols libxkbcommon' feeds/video/libs/sdl3/Makefile
          ! grep -Fq 'PKG_BUILD_DEPENDS:=wayland/host libwayland ' feeds/video/libs/sdl3/Makefile
          openclash_init='feeds/openclash/luci-app-openclash/root/etc/init.d/openclash'
          test -x "$openclash_init"
          grep -Fq '# CODEX_OFFLINE_ROOTFS_GUARD' "$openclash_init"
          grep -Fq 'if [ -z "${IPKG_INSTROOT:-}" ]; then' "$openclash_init"
          grep -Fq '. $IPKG_INSTROOT/usr/share/openclash/uci.sh' "$openclash_init"
          grep -Fq '. $IPKG_INSTROOT/usr/share/openclash/openclash_curl.sh' "$openclash_init"
          cmp -s "$RUNNER_TEMP/e87n-config-before-feeds" .config

      - name: Configure E87N target
        run: |
          set -o pipefail
          cmp -s .config.e87n .config
          cp .config.e87n .config
          make defconfig 2>&1 | tee defconfig.log
          ! grep -q 'recursive dependency detected' defconfig.log
          ! grep -q 'which does not exist' defconfig.log
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_edgepi_e87n=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-openclash=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=y$' .config
          grep -q '^CONFIG_PACKAGE_hysteria=y$' .config
          grep -q '^CONFIG_PACKAGE_openclash-core-meta=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-argon-config=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-nlbwmon-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-theme-argon=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-mod-admin-full=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-package-manager=y$' .config
          ! grep -q '^CONFIG_PACKAGE_luci=y$' .config
          ! grep -q '^CONFIG_PACKAGE_luci-light=y$' .config
          ! grep -q '^CONFIG_PACKAGE_luci-theme-bootstrap=y$' .config
          grep -q '^CONFIG_DISPLAY_SUPPORT=y$' .config
          ! grep -q '^CONFIG_PACKAGE_display=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-display=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-fanctrol=y$' .config
          ! grep -q '^CONFIG_PACKAGE_luci-app-fancontrol=y$' .config
          ! grep -q '^CONFIG_PACKAGE_fancontrol=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-nlbwmon=y$' .config
          grep -q '^CONFIG_PACKAGE_nlbwmon=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-samba4=y$' .config
          grep -q '^CONFIG_PACKAGE_samba4-server=y$' .config
          grep -q '^CONFIG_PACKAGE_mhz=y$' .config
          grep -q '^CONFIG_PACKAGE_pciutils=y$' .config
          grep -q '^CONFIG_PACKAGE_usbutils=y$' .config
          grep -q '^CONFIG_PER_FEED_REPO=y$' .config
          grep -q '^# CONFIG_FEED_openclash is not set$' .config
          grep -q '^# CONFIG_FEED_passwall_luci is not set$' .config
          grep -q '^# CONFIG_FEED_passwall_packages is not set$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-ttyd=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_ttyd=y$' .config
          ! grep -q '^CONFIG_PACKAGE_block-mount=' .config
          ! grep -q '^CONFIG_PACKAGE_block-mount=' .config.e87n
          grep -q '^CONFIG_PACKAGE_kmod-fs-ext4=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-backlight-pwm=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-fb-tft-nv3007=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-offload=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nvme=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-hwmon-core=y$' .config
          grep -q '^CONFIG_BUSYBOX_CONFIG_FLOCK=y$' .config

          # Keep the R3 Mini Passwall fixes byte-for-byte reproducible on E87N.
          # The pinned feed already includes lazy luci.cbi loading and no longer
          # contains the obsolete Socks wrapper markers, so only the three
          # still-missing runtime fixes are supplied through the rootfs overlay.
          passwall_app='files/usr/share/passwall/app.sh'
          passwall_init='files/etc/init.d/passwall'
          passwall_hotplug='files/etc/hotplug.d/iface/98-passwall'
          echo '84f76677fdceddb375eab5f0abf4c1e060b14396406ddb4ed019d987280ba0dd  files/usr/share/passwall/app.sh' | sha256sum -c -
          echo '9391931ee634d14583e484b09261a073086b0543a20674cc18707562254e6c67  files/etc/init.d/passwall' | sha256sum -c -
          echo 'a4a78482879696971aa754a9314caa35f50b63787358f17780afba7d1297aca6  files/etc/hotplug.d/iface/98-passwall' | sha256sum -c -
          sh -n "$passwall_app"
          sh -n "$passwall_init"
          sh -n "$passwall_hotplug"
          test "$(grep -Ec '^[[:space:]]*local (svr|rule|sub)_t=\$\(build_time ' "$passwall_app")" -eq 3
          grep -Fq 'CODEX_OFFLINE_ROOTFS_GUARD' "$passwall_init"
          grep -Fq '${IPKG_INSTROOT:-}' "$passwall_init"
          grep -Fq 'CODEX_PASSWALL_IFUP_DEBOUNCE_V2' "$passwall_hotplug"
          test "$(grep -Fc 'if flock -n 9; then' "$passwall_hotplug")" -eq 1
          test "$(grep -Fc 'sleep 4' "$passwall_hotplug")" -eq 1
          test "$(grep -Fc 'restart 8>&- 9>&- >/dev/null 2>&1; then' "$passwall_hotplug")" -eq 1
          ! grep -Fq 'restart >/dev/null 2>&1 &' "$passwall_hotplug"
          passwall_feed='feeds/passwall_luci/luci-app-passwall'
          ! grep -Eq '^[[:space:]]*cbi[[:space:]]*=[[:space:]]*require[[:space:]]*"luci\.cbi"[[:space:]]*$' "$passwall_feed/luasrc/passwall/api.lua"
          ! grep -Fq 'is_socks_wrap' "$passwall_feed/root/usr/share/passwall/nftables.sh"
          ! grep -Fq 'is_socks_wrap' "$passwall_feed/root/usr/share/passwall/iptables.sh"
          ! grep -Fq '#Socks_' "$passwall_feed/root/usr/share/passwall/nftables.sh"
          ! grep -Fq '#Socks_' "$passwall_feed/root/usr/share/passwall/iptables.sh"

          # Linux 6.18 fb.ko calls the backlight core while Linux 6.12 has the
          # reverse relation. Make-time selection must emit one edge, not two
          # mutually exclusive Kconfig selects, which Kconfig still rejects.
          grep -Fq 'BACKLIGHT_DEPENDS += +kmod-fb' package/kernel/linux/modules/video.mk
          grep -Fq 'FB_DEPENDS += +kmod-backlight' package/kernel/linux/modules/video.mk
          grep -Fq 'DEPENDS:=$(BACKLIGHT_DEPENDS)' package/kernel/linux/modules/video.mk
          grep -Fq 'DEPENDS:=$(FB_DEPENDS)' package/kernel/linux/modules/video.mk

          # E87N backlight is active-low: max raw brightness means fully off.
          grep -Fq 'max * (100 - percent)' package/luci-app-display/root/usr/sbin/display-control
          sed -n '/^turn_off()/,/^}/p' package/luci-app-display/root/usr/sbin/display-control |
            grep -Fq 'set_brightness "$max"'

          # Keep the exact user-supplied display executable inside the LuCI package.
          test -x package/luci-app-display/root/usr/sbin/display
          echo '4edc1c9be957d5d80ea7e90b6807e273c23ca3c860407a5353279d566ea33e15  package/luci-app-display/root/usr/sbin/display' | sha256sum -c -
          grep -Fq '+luci-base +kmod-backlight-pwm +kmod-fb-tft-nv3007 +libfreetype +libstdcpp +libgcc' package/luci-app-display/Makefile
          ! grep -Fq '+display' package/luci-app-display/Makefile
          grep -q '^PKG_RELEASE:=8$' package/luci-app-display/Makefile
          test ! -e package/display
          grep -Fq "this.settingsArgs('persist')" package/luci-app-display/htdocs/luci-static/resources/view/display/index.js
          grep -Fq "class: 'display-page-head'" package/luci-app-display/htdocs/luci-static/resources/view/display/index.js
          grep -Fq "'display-master-switch'" package/luci-app-display/htdocs/luci-static/resources/view/display/index.js
          grep -Fq 'E87N_DESIRED_HEADER_V2' package/luci-app-display/htdocs/luci-static/resources/view/display/index.js
          grep -Fq 'return this.runHelper(args)' package/luci-app-display/htdocs/luci-static/resources/view/display/index.js
          ! grep -Fq 'queueHelper' package/luci-app-display/htdocs/luci-static/resources/view/display/index.js
          grep -Fq "this.fireHelper([ 'apply', String(raw), String(this.state.screen) ])" package/luci-app-display/htdocs/luci-static/resources/view/display/index.js
          grep -Fq "this.fireHelper([ 'off' ])" package/luci-app-display/htdocs/luci-static/resources/view/display/index.js
          ! grep -Fq 'this.renderActions()' package/luci-app-display/htdocs/luci-static/resources/view/display/index.js
          grep -Fq 'persist)' package/luci-app-display/root/usr/sbin/display-control
          grep -Fq 'local reload_after="${14:-1}"' package/luci-app-display/root/usr/sbin/display-control
          grep -Fq 'turn_on' package/luci-app-display/root/usr/sbin/display-control
          grep -Fq 'turn_off' package/luci-app-display/root/usr/sbin/display-control
          grep -Fq 'disable_console_cursor' package/luci-app-display/root/usr/sbin/display-control
          grep -Fq '/sys/class/graphics/fbcon/cursor_blink' package/luci-app-display/root/usr/sbin/display-control
          grep -Fq "printf '\\033[?25l'" package/luci-app-display/root/usr/sbin/display-control
          grep -Fq '/etc/init.d/display-control start' package/luci-app-display/root/usr/sbin/display-control
          ! grep -Fq '/etc/init.d/display-control restart' package/luci-app-display/root/usr/sbin/display-control
          grep -Fq "option enabled '1'" package/luci-app-display/root/etc/config/display
          grep -Fq "option screen '1'" package/luci-app-display/root/etc/config/display
          grep -Fq "name: _('日间模式')" package/luci-app-display/htdocs/luci-static/resources/view/display/index.js
          ! grep -Fq '早晨模式' package/luci-app-display/htdocs/luci-static/resources/view/display/index.js
          ! grep -Fq 'brightness_slot1_' package/luci-app-display/root/etc/config/display
          grep -Fq 'for idx in 2 3' package/luci-app-display/root/usr/sbin/display-control
          grep -Fq '@media (max-width: 420px)' package/luci-app-display/htdocs/luci-static/resources/view/display/index.js
          grep -Fq '@media (max-width: 820px)' package/luci-app-display/htdocs/luci-static/resources/view/display/index.js

          # E87N-only overview: always expanded, live CPU temperature and TTYD last.
          overview_pkg='package/e87n-luci-overview'
          grep -Fq 'e87n-luci-overview' target/linux/mediatek/image/filogic.mk
          grep -Fxq 'define Build/Compile' "$overview_pkg/Makefile"
          ! grep -Fq 'handleToggleSection' "$overview_pkg/files/status-index.js"
          ! grep -Fq "_('Hide')" "$overview_pkg/files/status-index.js"
          grep -Fq 'localStorage.removeItem(includes[i].id)' "$overview_pkg/files/status-index.js"
          grep -Fq "fs.read('/sys/devices/virtual/thermal/thermal_zone0/temp')" "$overview_pkg/files/status-10-system.js"
          grep -Fq "cpuInfo = (boardinfo.system || 'ARMv8 Processor rev 4') + ' (v8l) x 4'" "$overview_pkg/files/status-10-system.js"
          grep -Fq "cpuInfo += ' (' + cpuTemp + ')'" "$overview_pkg/files/status-10-system.js"
          grep -Fq "'目标平台',     'mediatek/mt7987'" "$overview_pkg/files/status-10-system.js"
          ! grep -Fq "'CPU 温度'" "$overview_pkg/files/status-10-system.js"
          grep -Fq '"order": 9999' "$overview_pkg/files/luci-app-ttyd.json"
          grep -Fq 'admin/system/plugins' "$overview_pkg/files/zz-e87n-menu-overrides.json"
          grep -Fq 'admin/services/upnp' "$overview_pkg/files/zz-e87n-menu-overrides.json"
          grep -Fq 'admin/network/dhcpdns' "$overview_pkg/files/zz-e87n-menu-overrides.json"
          grep -Fq 'network/dhcp' "$overview_pkg/files/zz-e87n-menu-overrides.json"
          grep -Fq 'network/dns' "$overview_pkg/files/zz-e87n-menu-overrides.json"
          grep -Fq 'admin/nas/samba4' "$overview_pkg/files/zz-e87n-menu-overrides.json"
          grep -Fq 'admin/services/samba4' "$overview_pkg/files/zz-e87n-menu-overrides.json"
          grep -Fq '"order": 0' "$overview_pkg/files/zz-e87n-menu-overrides.json"
          grep -Fq 'edgepi,e87n' "$overview_pkg/files/e87n-luci-overview.init"
          grep -Fq 'luci-app-upnp' target/linux/mediatek/image/filogic.mk
          grep -q '^CONFIG_PACKAGE_luci-app-upnp=y$' .config.e87n
          grep -q '^CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y$' .config.e87n

          # Linux 6.18 modpost must see all gpio-button-hotplug metadata in
          # the input object, not merely the mandatory license record.
          gpio_pkg='package/kernel/gpio-button-hotplug'
          grep -q '^PKG_RELEASE:=7$' "$gpio_pkg/Makefile"
          grep -Fq 'GPIO_BUTTON_MODINFO(gpio_button_description, "description",' "$gpio_pkg/src/gpio-button-hotplug.c"
          grep -Fq 'GPIO_BUTTON_MODINFO(gpio_button_alias, "alias", "platform:" DRV_NAME);' "$gpio_pkg/src/gpio-button-hotplug.c"

          # Keep the 3.2.14-7 UI and persistence contract while using only
          # E87N's forward PWM states and real CPU/PHY/NVMe sensors.
          fanpkg='package/luci-app-fanctrol'
          grep -q '^PKG_VERSION:=3.2.14$' "$fanpkg/Makefile"
          grep -q '^PKG_RELEASE:=7$' "$fanpkg/Makefile"
          grep -Fq "TEMP_SOURCE_IDS = { \"cpu\", \"phy\", \"nvme1\", \"nvme2\" }" "$fanpkg/luasrc/controller/fancontrol.lua"
          grep -Fq '<option value="phy" hidden disabled><%:Fan Source Ethernet PHY%></option>' "$fanpkg/luasrc/view/fancontrol/main.htm"
          grep -Fq '<option value="nvme1" hidden disabled><%:Fan Source Solid State Drive 1%></option>' "$fanpkg/luasrc/view/fancontrol/main.htm"
          grep -Fq '<option value="nvme2" hidden disabled><%:Fan Source Solid State Drive 2%></option>' "$fanpkg/luasrc/view/fancontrol/main.htm"
          grep -Fq "var isNvme = key === 'nvme1' || key === 'nvme2';" "$fanpkg/luasrc/view/fancontrol/main.htm"
          grep -Fq 'fallbackUnavailableNvmeSource();' "$fanpkg/luasrc/view/fancontrol/main.htm"
          grep -Fq 'BOARD_NAME="$(cat /tmp/sysinfo/board_name 2>/dev/null)"' "$fanpkg/root/usr/bin/fancontrol"
          grep -Fq 'state=$(((percent * max_state + 50) / 100))' "$fanpkg/root/usr/bin/fancontrol"
          ! grep -Fq 'max_state + 1' "$fanpkg/root/usr/bin/fancontrol"
          ! grep -Fq 'procd_open_instance sensors' "$fanpkg/root/etc/init.d/fancontrol"
          test ! -e "$fanpkg/root/usr/bin/fancontrol-sensors"
          grep -Fq 'name" in mdio_bus:*' "$fanpkg/root/usr/bin/fancontrol"
          grep -Fq 'input="$hwmon/temp1_input"' "$fanpkg/root/usr/bin/fancontrol"
          grep -Fq 'source_phy_state=' "$fanpkg/root/usr/bin/fancontrol"
          grep -Fq 'source_nvme1_state=' "$fanpkg/root/usr/bin/fancontrol"
          grep -Fq 'source_nvme2_state=' "$fanpkg/root/usr/bin/fancontrol"
          python3 "$fanpkg/tools/test_release_3_2_14.py"
          python3 "$fanpkg/tools/test_fan_power_states.py"
          python3 "$fanpkg/tools/test_temperature_sources.py"
          python3 "$fanpkg/tools/test_upgrade_paths.py"

          # nlbwmon defaults to /var, which is volatile on this image. The
          # E87N first-boot setup moves only the untouched default to overlay.
          grep -Fq "database_directory=/etc/nlbwmon" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "grep -qxF '/etc/nlbwmon/' /etc/sysupgrade.conf" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults

          # Sequential DHCP leases cover every usable host address after .1.
          grep -Fq "'password' 'password' | passwd root" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "system.@system[0].hostname='EdgePi E87N'" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "system.ntp.server='ntp1.aliyun.com'" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "system.ntp.server='ntp2.aliyun.com'" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "system.ntp.server='ntp3.aliyun.com'" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq 'cp /usr/share/e87n/banner /etc/banner' target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq '_____    _            ____  _   _____ ___ _____ _   _' target/linux/mediatek/filogic/base-files/usr/share/e87n/banner
          grep -Fq '@E87N_BUILD_INFO@' target/linux/mediatek/filogic/base-files/usr/share/e87n/banner
          grep -Fq "OPENWRT_BUILD_DATE=" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq 'By ZJJCKA' target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq '/openclash\(/packages\.adb\)\?$' target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq '/passwall_luci\(/packages\.adb\)\?$' target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq '/passwall_packages\(/packages\.adb\)\?$' target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          test ! -e files/etc/banner
          grep -Fq "network.lan.ipaddr='192.168.88.1/24'" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "dhcp.@dnsmasq[0].sequential_ip=1" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "dhcp.lan.ignore=0" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "dhcp.lan.dhcpv4=server" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "dhcp.lan.start=2" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "dhcp.lan.limit=253" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "luci.main.lang=zh_cn" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq 'vt.global_cursor_default=0' target/linux/mediatek/dts/mt7987a-edgepi-e87n.dts

          # OpenClash is promoted ahead of Passwall only by the E87N board case.
          defaults='target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults'
          grep -Fq "openclash_controller='/usr/lib/lua/luci/controller/openclash.lua'" "$defaults"
          grep -Fq "sed -i 's/_(\"OpenClash\"), 50)/_(\"OpenClash\"), -5)/'" "$defaults"
          openclash_controller='feeds/openclash/luci-app-openclash/luasrc/controller/openclash.lua'
          grep -Fq '_("OpenClash"), 50)' "$openclash_controller"
          cp "$openclash_controller" "$RUNNER_TEMP/openclash.lua"
          sed -i 's/_("OpenClash"), 50)/_("OpenClash"), -5)/' "$RUNNER_TEMP/openclash.lua"
          grep -Fq '_("OpenClash"), -5)' "$RUNNER_TEMP/openclash.lua"

          # AliDNS remains available even when there is no conventional WAN.
          grep -Fq "network.lan.dns='223.5.5.5'" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "network.lan.dns='223.6.6.6'" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "dhcp.@dnsmasq[0].noresolv=1" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "dhcp.@dnsmasq[0].server=223.5.5.5" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "dhcp.@dnsmasq[0].server=223.6.6.6" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults

          # Pin modern Argon sources and force it as the only shipped theme.
          grep -q '^PKG_VERSION:=2.4.6$' package/luci-theme-argon/Makefile
          grep -q '^revision=86c3156bab0ee2b8c91af68b3fa4655f2df51d09$' package/luci-theme-argon/UPSTREAM
          grep -q '^revision=3e099a37c3f71d0de677f1b6b0f4bffd57d91dac$' package/luci-app-argon-config/UPSTREAM
          grep -Fq "luci.main.mediaurlbase=/luci-static/argon" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults

          # E87N Reset: eight seconds; all other boards keep five seconds.
          reset_script='package/base-files/files/etc/rc.button/reset'
          grep -Fq 'RESET_HOLD_SECONDS=5' "$reset_script"
          grep -Fq "[ \"\$(board_name)\" = 'edgepi,e87n' ] && RESET_HOLD_SECONDS=8" "$reset_script"
          grep -Fq 'return "$RESET_HOLD_SECONDS"' "$reset_script"
          grep -Fq '"$SEEN" -ge "$RESET_HOLD_SECONDS"' "$reset_script"
          grep -Fq 'factoryreset -y && reboot &' "$reset_script"

          # MODULE_STRIPPED deliberately removes descriptions; Linux 6.18
          # modpost must not warn about metadata which this config omits.
          module_strip_patch='target/linux/generic/hack-6.18/204-module_strip.patch'
          grep -Fq '+#ifndef CONFIG_MODULE_STRIPPED' "$module_strip_patch"
          grep -Fq 'if (!get_modinfo(&info, "description"))' "$module_strip_patch"
          grep -Fq 'warn("missing MODULE_DESCRIPTION() in %s\n", modname);' "$module_strip_patch"

          e87n_defaults='target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults'
          grep -Fq "uci -q set 'upnpd.config.enabled=1'" "$e87n_defaults"
          grep -Fq "uci -q set 'upnpd.config.enable_upnp=1'" "$e87n_defaults"
          grep -Fq "uci -q set 'upnpd.config.enable_natpmp=1'" "$e87n_defaults"
          grep -Fq "uci -q set 'upnpd.config.ext_allow_private_ipv4=1'" "$e87n_defaults"
          grep -Fq "uci -q set 'argon.@global[0].online_wallpaper=bing'" "$e87n_defaults"
          grep -Fq "uci -q set 'argon.@global[0].mode=normal'" "$e87n_defaults"
          grep -Fq "uci -q set 'argon.@global[0].primary=#5e72e4'" "$e87n_defaults"
          grep -Fq "uci -q set 'argon.@global[0].transparency=0'" "$e87n_defaults"
          grep -Fq "uci -q set 'argon.@global[0].blur=0'" "$e87n_defaults"
          grep -Fq "uci -q set 'argon.@global[0].dark_primary=#483d8b'" "$e87n_defaults"
          grep -Fq "uci -q set 'argon.@global[0].transparency_dark=0'" "$e87n_defaults"
          grep -Fq "uci -q set 'argon.@global[0].blur_dark=0'" "$e87n_defaults"
          grep -Fq "system.@system[0].zonename='Asia/Shanghai'" "$e87n_defaults"
          grep -Fq "system.@system[0].timezone='CST-8'" "$e87n_defaults"

      - name: Verify pinned package toolchains
        run: |
          grep -q '^GO_DEFAULT_VERSION:=1.26$' feeds/packages/lang/golang/golang-values.mk
          grep -q '^GO_VERSION_PATCH:=5$' feeds/packages/lang/golang/golang1.26/Makefile
          grep -q '^PKG_VERSION:=1.96.0$' feeds/packages/lang/rust/Makefile
          grep -q '^PKG_VERSION:=1.4.7$' feeds/packages/admin/btop/Makefile
          grep -q '^PKG_VERSION:=26.8.12$' feeds/passwall_luci/luci-app-passwall/Makefile
          grep -q '^PKG_VERSION:=2.12.1$' feeds/passwall_packages/hysteria/Makefile
          grep -q '^PKG_VERSION:=0.47.156$' feeds/openclash/luci-app-openclash/Makefile
          grep -q '^PKG_VERSION:=0.0.0_alpha~e183c58$' package/openclash-core-meta/Makefile
          grep -q '^OPENCLASH_CORE_VERSION:=alpha-ge183c58$' package/openclash-core-meta/Makefile
          grep -q '^OPENCLASH_CORE_COMMIT:=7dedf5508d1aba0360820bff3532eb4257c79fae$' package/openclash-core-meta/Makefile
          grep -q '^  HASH:=8252d16726041872825cdd9089c798c318f8862466b40b34d8bf62225ef57e34$' package/openclash-core-meta/Makefile
          grep -q '^RSTRIP:=:$' package/openclash-core-meta/Makefile
          grep -q '^STRIP:=:$' package/openclash-core-meta/Makefile

          # Ruby 4.0 bundled-gem layout must not emit false missing-file or
          # Windows-only extension diagnostics during the E87N build.
          ruby_makefile='feeds/packages/lang/ruby/Makefile'
          ! grep -Fqx '/usr/lib/ruby/$(PKG_ABI_VERSION)/*/bigdecimal.so' "$ruby_makefile"
          ! grep -Fqx '/usr/lib/ruby/$(PKG_ABI_VERSION)/pstore.rb' "$ruby_makefile"
          grep -Fqx '/usr/lib/ruby/gems/$(PKG_ABI_VERSION)/gems/bigdecimal-*/' "$ruby_makefile"
          grep -Fqx '/usr/lib/ruby/gems/$(PKG_ABI_VERSION)/gems/pstore-*/' "$ruby_makefile"
          grep -Fq -- '-win32ole            1.9.2' feeds/packages/lang/ruby/patches/999-ruby-4.0-skip-win32ole.patch

      - name: Download sources
        run: |
          make download -j8
          find dl -type f -size -1024c -print -delete
          make download -j8

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" V=s 2>&1 | tee build.log; then
            make -j1 V=s 2>&1 | tee build-j1.log
          fi

      - name: Verify kernel and firmware contents
        shell: bash
        run: |
          set -euxo pipefail
          image_dir='bin/targets/mediatek/filogic'
          sysupgrade="$(find "$image_dir" -maxdepth 1 -type f -name '*edgepi*e87n*squashfs-sysupgrade.bin' -print -quit)"
          initramfs="$(find "$image_dir" -maxdepth 1 -type f -name '*edgepi*e87n*initramfs*' -print -quit)"
          test -n "$sysupgrade" && test -s "$sysupgrade"
          test -n "$initramfs" && test -s "$initramfs"

          manifest="$(find "$image_dir" -maxdepth 1 -type f -name '*edgepi*e87n.manifest' -print -quit)"
          test -n "$manifest" && test -s "$manifest"
          ! grep -q '^display ' "$manifest"
          grep -q '^luci-app-display ' "$manifest"
          grep -q '^luci-app-nlbwmon ' "$manifest"
          grep -q '^nlbwmon ' "$manifest"
          grep -q '^luci-app-samba4 ' "$manifest"
          grep -q '^samba4-server ' "$manifest"
          grep -q '^mhz ' "$manifest"
          grep -q '^pciutils ' "$manifest"
          grep -q '^usbutils ' "$manifest"
          grep -q '^luci-app-ttyd ' "$manifest"
          grep -q '^luci-i18n-ttyd-zh-cn ' "$manifest"
          grep -q '^ttyd ' "$manifest"
          grep -q '^luci-app-argon-config ' "$manifest"
          grep -q '^luci-app-fanctrol ' "$manifest"
          ! grep -q '^luci-app-fancontrol ' "$manifest"
          ! grep -q '^fancontrol ' "$manifest"
          grep -q '^luci-i18n-base-zh-cn ' "$manifest"
          grep -q '^luci-i18n-argon-config-zh-cn ' "$manifest"
          grep -q '^luci-i18n-firewall-zh-cn ' "$manifest"
          grep -q '^luci-i18n-nlbwmon-zh-cn ' "$manifest"
          grep -q '^luci-i18n-package-manager-zh-cn ' "$manifest"
          grep -q '^luci-i18n-passwall-zh-cn ' "$manifest"
          grep -q '^luci-i18n-samba4-zh-cn ' "$manifest"
          grep -q '^hysteria ' "$manifest"
          grep -q '^luci-theme-argon ' "$manifest"
          grep -q '^openclash-core-meta ' "$manifest"
          ! grep -q '^luci-theme-bootstrap ' "$manifest"
          ! grep -q '^block-mount ' "$manifest"
          grep -q '^kmod-fs-ext4 ' "$manifest"
          grep -q '^kmod-backlight-pwm ' "$manifest"
          grep -q '^kmod-fb-tft-nv3007 ' "$manifest"
          grep -q '^kmod-nvme ' "$manifest"
          grep -q '^kmod-hwmon-core ' "$manifest"
          grep -q '^kmod-nft-offload ' "$manifest"

          gpio_object="$(find build_dir/target-aarch64_cortex-a53_musl -path '*/linux-mediatek_filogic/gpio-button-hotplug/gpio-button-hotplug.o' -print -quit)"
          test -n "$gpio_object" && test -s "$gpio_object"
          readelf -p .modinfo "$gpio_object" | tee "$RUNNER_TEMP/gpio-button-hotplug.modinfo"
          grep -Fq 'description=Polled GPIO Buttons hotplug driver' "$RUNNER_TEMP/gpio-button-hotplug.modinfo"
          grep -Fq 'alias=platform:gpio-keys' "$RUNNER_TEMP/gpio-button-hotplug.modinfo"
          grep -Fq 'author=Gabor Juhos <juhosg@openwrt.org>' "$RUNNER_TEMP/gpio-button-hotplug.modinfo"
          grep -Fq 'author=Felix Fietkau <nbd@nbd.name>' "$RUNNER_TEMP/gpio-button-hotplug.modinfo"
          warning_logs=(build.log)
          test ! -f build-j1.log || warning_logs+=(build-j1.log)
          ! grep -q 'missing MODULE_DESCRIPTION() in gpio-button-hotplug.o' "${warning_logs[@]}"
          ! grep -Eq '/usr/share/openclash/(uci|openclash_curl)\.sh: line [0-9]+: .*No such file or directory' "${warning_logs[@]}"

          kernel_config="$(find build_dir/target-aarch64_cortex-a53_musl -path '*/linux-mediatek_filogic/linux-6.18*/.config' -print -quit)"
          test -n "$kernel_config"
          grep -q '^CONFIG_FB_TFT_NV3007=m$' "$kernel_config"
          grep -q '^CONFIG_HWMON=m$' "$kernel_config"
          grep -q '^CONFIG_NVME_HWMON=y$' "$kernel_config"
          grep -q '^CONFIG_NF_FLOW_TABLE_HW=m$' "$kernel_config"
          grep -q '^CONFIG_NET_MEDIATEK_SOC=y$' "$kernel_config"

          # E87N runtime-log fixes must remain structural source fixes rather
          # than warning filters.
          e87n_dts='target/linux/mediatek/dts/mt7987a-edgepi-e87n.dts'
          ! grep -Fq 'fbcon=disable' "$e87n_dts"
          grep -Fq 'nvmem-cells = <&macaddr_factory_24 0>;' "$e87n_dts"
          grep -Fq 'nvmem-cells = <&macaddr_factory_2a 0>;' "$e87n_dts"
          grep -Fq 'interrupt-names = "fe0", "fe1", "fe2", "fe3";' target/linux/mediatek/dts/mt7987.dtsi
          grep -Fq 'FBTFT_REGISTER_SPI_DRIVER(DRVNAME, "newvisionu", "nv3007", &display);' target/linux/mediatek/patches-6.18/999990-add-nv3007-fbtft.patch

          realtek_source="$(find build_dir/target-aarch64_cortex-a53_musl -path '*/linux-6.18*/drivers/net/phy/realtek/realtek_main.c' -print -quit)"
          test -n "$realtek_source"
          grep -q 'RTL8221B_LED_LINK_SELECT' "$realtek_source"

          work="$RUNNER_TEMP/e87n-verify"
          mkdir -p "$work/sysupgrade" "$work/rootfs"
          tar -xf "$sysupgrade" -C "$work/sysupgrade"
          rootfs="$(find "$work/sysupgrade" -type f -name root -print -quit)"
          test -n "$rootfs"
          unsquashfs -d "$work/rootfs" "$rootfs" >/dev/null

          test -x "$work/rootfs/usr/sbin/display"
          test -x "$work/rootfs/usr/sbin/display-control"
          test -x "$work/rootfs/etc/init.d/display-control"
          test -x "$work/rootfs/usr/sbin/nlbwmon"
          test -x "$work/rootfs/etc/init.d/nlbwmon"
          test -f "$work/rootfs/etc/config/nlbwmon"
          test -x "$work/rootfs/usr/sbin/smbd"
          test -x "$work/rootfs/etc/init.d/samba4"
          test -f "$work/rootfs/etc/config/samba4"
          test -x "$work/rootfs/usr/sbin/mhz"
          test -x "$work/rootfs/usr/bin/lspci"
          test -x "$work/rootfs/usr/bin/lsusb"
          test -x "$work/rootfs/usr/bin/ttyd"
          test -x "$work/rootfs/etc/init.d/ttyd"
          test -f "$work/rootfs/etc/config/ttyd"
          test -f "$work/rootfs/www/luci-static/resources/view/ttyd/term.js"
          test ! -e "$work/rootfs/sbin/block"
          test -f "$work/rootfs/etc/config/argon"
          test -f "$work/rootfs/usr/lib/lua/luci/i18n/base.zh-cn.lmo"
          test -f "$work/rootfs/usr/lib/lua/luci/i18n/argon-config.zh-cn.lmo"
          test -f "$work/rootfs/usr/share/e87n-luci-overview/menu/zz-e87n-menu-overrides.json"
          grep -Fq 'admin/system/plugins' "$work/rootfs/usr/share/e87n-luci-overview/menu/zz-e87n-menu-overrides.json"
          grep -Fq 'admin/services/upnp' "$work/rootfs/usr/share/e87n-luci-overview/menu/zz-e87n-menu-overrides.json"
          grep -Fq 'admin/network/dhcpdns' "$work/rootfs/usr/share/e87n-luci-overview/menu/zz-e87n-menu-overrides.json"
          grep -Fq 'admin/nas/samba4' "$work/rootfs/usr/share/e87n-luci-overview/menu/zz-e87n-menu-overrides.json"
          test -d "$work/rootfs/www/luci-static/argon"
          test ! -e "$work/rootfs/www/luci-static/bootstrap"
          test -x "$work/rootfs/usr/bin/fancontrol"
          test ! -e "$work/rootfs/usr/bin/fancontrol-sensors"
          test -x "$work/rootfs/etc/init.d/fancontrol"
          test -f "$work/rootfs/usr/lib/lua/luci/i18n/fancontrol-bundled.zh-cn.lmo"
          grep -Fq 'Fan Source Ethernet PHY' "$work/rootfs/usr/lib/lua/luci/view/fancontrol/main.htm"
          grep -Fq 'Fan Source Solid State Drive 1' "$work/rootfs/usr/lib/lua/luci/view/fancontrol/main.htm"
          grep -Fq 'Fan Source Solid State Drive 2' "$work/rootfs/usr/lib/lua/luci/view/fancontrol/main.htm"
          grep -Fq 'source_phy_state=' "$work/rootfs/usr/bin/fancontrol"
          grep -Fq 'source_nvme1_state=' "$work/rootfs/usr/bin/fancontrol"
          grep -Fq 'source_nvme2_state=' "$work/rootfs/usr/bin/fancontrol"
          grep -Fq 'input="$hwmon/temp1_input"' "$work/rootfs/usr/bin/fancontrol"
          grep -Fq 'state=$(((percent * max_state + 50) / 100))' "$work/rootfs/usr/bin/fancontrol"
          grep -Fq 'disable_console_cursor' "$work/rootfs/usr/sbin/display-control"
          grep -Fq '/sys/class/graphics/fbcon/cursor_blink' "$work/rootfs/usr/sbin/display-control"
          ! grep -Fq 'max_state + 1' "$work/rootfs/usr/bin/fancontrol"
          test -x "$work/rootfs/etc/openclash/core/clash_meta"
          test -x "$work/rootfs/usr/bin/hysteria"
          find "$work/rootfs" -type f -name 'passwall*.lmo' -print -quit | grep -q .
          test -x "$work/rootfs/usr/bin/btop"
          test -d "$work/rootfs/usr/share/openclash"
          test -d "$work/rootfs/usr/share/passwall"
          test -x "$work/rootfs/usr/bin/flock"
          test -x "$work/rootfs/usr/share/passwall/app.sh"
          test -x "$work/rootfs/etc/init.d/passwall"
          test -f "$work/rootfs/etc/hotplug.d/iface/98-passwall"
          echo "84f76677fdceddb375eab5f0abf4c1e060b14396406ddb4ed019d987280ba0dd  $work/rootfs/usr/share/passwall/app.sh" | sha256sum -c -
          echo "9391931ee634d14583e484b09261a073086b0543a20674cc18707562254e6c67  $work/rootfs/etc/init.d/passwall" | sha256sum -c -
          echo "a4a78482879696971aa754a9314caa35f50b63787358f17780afba7d1297aca6  $work/rootfs/etc/hotplug.d/iface/98-passwall" | sha256sum -c -
          grep -Fq 'CODEX_OFFLINE_ROOTFS_GUARD' "$work/rootfs/etc/init.d/passwall"
          grep -Fq 'CODEX_PASSWALL_IFUP_DEBOUNCE_V2' "$work/rootfs/etc/hotplug.d/iface/98-passwall"
          test -f "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "'password' 'password' | passwd root" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "system.@system[0].hostname='EdgePi E87N'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "system.ntp.server='ntp1.aliyun.com'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "system.ntp.server='ntp2.aliyun.com'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "system.ntp.server='ntp3.aliyun.com'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq 'cp /usr/share/e87n/banner /etc/banner' "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq '_____    _            ____  _   _____ ___ _____ _   _' "$work/rootfs/usr/share/e87n/banner"
          grep -Fq '@E87N_BUILD_INFO@' "$work/rootfs/usr/share/e87n/banner"
          grep -Fq "network.lan.ipaddr='192.168.88.1/24'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -q "flow_offloading_hw='1'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -q "database_directory=/etc/nlbwmon" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "dhcp.@dnsmasq[0].sequential_ip=1" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "dhcp.lan.ignore=0" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "dhcp.lan.dhcpv4=server" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "dhcp.lan.start=2" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "dhcp.lan.limit=253" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "luci.main.lang=zh_cn" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "packaged_meta_core='/rom/etc/openclash/core/clash_meta'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq 'cmp -s "$packaged_meta_core" "$active_meta_core"' "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          find "$work/rootfs/usr/lib/lua/luci/i18n" -name 'base.zh-cn.lmo' -size +0c -print -quit | grep -q .
          grep -Fq "openclash_controller='/usr/lib/lua/luci/controller/openclash.lua'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "sed -i 's/_(\"OpenClash\"), 50)/_(\"OpenClash\"), -5)/'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "network.lan.dns='223.5.5.5'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "network.lan.dns='223.6.6.6'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "dhcp.@dnsmasq[0].server=223.5.5.5" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "dhcp.@dnsmasq[0].server=223.6.6.6" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "luci.main.mediaurlbase=/luci-static/argon" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          for feed_file in \
            "$work/rootfs/etc/apk/repositories.d/distfeeds.list" \
            "$work/rootfs/etc/opkg/distfeeds.conf"; do
            test ! -f "$feed_file" || ! grep -Eq '/(openclash|passwall_luci|passwall_packages)(/packages\.adb)?$' "$feed_file"
          done
          find "$work/rootfs/lib/modules" -name 'fb_nv3007.ko' -print -quit | grep -q .
          find "$work/rootfs/lib/modules" -name 'hwmon.ko' -print -quit | grep -q .
          find "$work/rootfs/lib/modules" -name 'nvme-core.ko' -print -quit | grep -q .
          find "$work/rootfs/lib/modules" -name 'nf_flow_table.ko' -print -quit | grep -q .

          file "$work/rootfs/usr/sbin/display" | grep -q 'ARM aarch64'
          echo "4edc1c9be957d5d80ea7e90b6807e273c23ca3c860407a5353279d566ea33e15  $work/rootfs/usr/sbin/display" | sha256sum -c -
          file "$work/rootfs/etc/openclash/core/clash_meta" | grep -q 'ARM aarch64'

          {
            echo "sysupgrade=$sysupgrade"
            echo "initramfs=$initramfs"
            echo 'go=1.26.5'
            echo 'rust=1.96.0'
            echo 'btop=1.4.7'
            echo 'passwall=26.8.12'
            echo 'hysteria=2.12.1'
            echo 'openclash=0.47.156'
            echo 'mihomo=alpha-ge183c58'
            echo 'nvme_hwmon=CONFIG_NVME_HWMON=y'
            echo 'display_binary_sha256=4edc1c9be957d5d80ea7e90b6807e273c23ca3c860407a5353279d566ea33e15'
            sha256sum "$sysupgrade" "$initramfs"
          } | tee "$image_dir/e87n-verification.txt"

      - name: Upload E87N firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgepi-e87n-firmware-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            bin/targets/mediatek/filogic/*edgepi*e87n*
            bin/targets/mediatek/filogic/e87n-verification.txt
            bin/targets/mediatek/filogic/sha256sums
            build.log
            build-j1.log
            defconfig.log
