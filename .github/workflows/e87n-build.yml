name: Build EdgePi E87N firmware

on:
  workflow_dispatch:
  push:
    branches:
      - e87n
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: e87n-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            squashfs-tools swig unzip zlib1g-dev file wget

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Configure E87N target
        run: |
          set -o pipefail
          cmp -s .config.e87n .config
          cp .config.e87n .config
          make defconfig 2>&1 | tee defconfig.log
          ! grep -q 'recursive dependency detected' defconfig.log
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_edgepi_e87n=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-openclash=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall=y$' .config
          grep -q '^CONFIG_PACKAGE_openclash-core-meta=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-argon-config=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-theme-argon=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-mod-admin-full=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-package-manager=y$' .config
          ! grep -q '^CONFIG_PACKAGE_luci=y$' .config
          ! grep -q '^CONFIG_PACKAGE_luci-light=y$' .config
          ! grep -q '^CONFIG_PACKAGE_luci-theme-bootstrap=y$' .config
          grep -q '^CONFIG_DISPLAY_SUPPORT=y$' .config
          grep -q '^CONFIG_PACKAGE_display=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-display=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-nlbwmon=y$' .config
          grep -q '^CONFIG_PACKAGE_nlbwmon=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-samba4=y$' .config
          grep -q '^CONFIG_PACKAGE_samba4-server=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-ttyd=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_ttyd=y$' .config
          grep -q '^CONFIG_PACKAGE_block-mount=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-fs-ext4=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-backlight-pwm=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-fb-tft-nv3007=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-offload=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nvme=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-hwmon-core=y$' .config
          grep -q '^CONFIG_BUSYBOX_CONFIG_FLOCK=y$' .config

          # Keep the R3 Mini Passwall fixes byte-for-byte reproducible on E87N.
          # The pinned feed already includes lazy luci.cbi loading and no longer
          # contains the obsolete Socks wrapper markers, so only the three
          # still-missing runtime fixes are supplied through the rootfs overlay.
          passwall_app='files/usr/share/passwall/app.sh'
          passwall_init='files/etc/init.d/passwall'
          passwall_hotplug='files/etc/hotplug.d/iface/98-passwall'
          echo '84f76677fdceddb375eab5f0abf4c1e060b14396406ddb4ed019d987280ba0dd  files/usr/share/passwall/app.sh' | sha256sum -c -
          echo '9391931ee634d14583e484b09261a073086b0543a20674cc18707562254e6c67  files/etc/init.d/passwall' | sha256sum -c -
          echo 'a4a78482879696971aa754a9314caa35f50b63787358f17780afba7d1297aca6  files/etc/hotplug.d/iface/98-passwall' | sha256sum -c -
          sh -n "$passwall_app"
          sh -n "$passwall_init"
          sh -n "$passwall_hotplug"
          test "$(grep -Ec '^[[:space:]]*local (svr|rule|sub)_t=\$\(build_time ' "$passwall_app")" -eq 3
          grep -Fq 'CODEX_OFFLINE_ROOTFS_GUARD' "$passwall_init"
          grep -Fq '${IPKG_INSTROOT:-}' "$passwall_init"
          grep -Fq 'CODEX_PASSWALL_IFUP_DEBOUNCE_V2' "$passwall_hotplug"
          test "$(grep -Fc 'if flock -n 9; then' "$passwall_hotplug")" -eq 1
          test "$(grep -Fc 'sleep 4' "$passwall_hotplug")" -eq 1
          test "$(grep -Fc 'restart 8>&- 9>&- >/dev/null 2>&1; then' "$passwall_hotplug")" -eq 1
          ! grep -Fq 'restart >/dev/null 2>&1 &' "$passwall_hotplug"
          passwall_feed='feeds/passwall_luci/luci-app-passwall'
          ! grep -Eq '^[[:space:]]*cbi[[:space:]]*=[[:space:]]*require[[:space:]]*"luci\.cbi"[[:space:]]*$' "$passwall_feed/luasrc/passwall/api.lua"
          ! grep -Fq 'is_socks_wrap' "$passwall_feed/root/usr/share/passwall/nftables.sh"
          ! grep -Fq 'is_socks_wrap' "$passwall_feed/root/usr/share/passwall/iptables.sh"
          ! grep -Fq '#Socks_' "$passwall_feed/root/usr/share/passwall/nftables.sh"
          ! grep -Fq '#Socks_' "$passwall_feed/root/usr/share/passwall/iptables.sh"

          # Linux 6.18 fb.ko calls the backlight core while Linux 6.12 has the
          # reverse relation. Make-time selection must emit one edge, not two
          # mutually exclusive Kconfig selects, which Kconfig still rejects.
          grep -Fq 'BACKLIGHT_DEPENDS += +kmod-fb' package/kernel/linux/modules/video.mk
          grep -Fq 'FB_DEPENDS += +kmod-backlight' package/kernel/linux/modules/video.mk
          grep -Fq 'DEPENDS:=$(BACKLIGHT_DEPENDS)' package/kernel/linux/modules/video.mk
          grep -Fq 'DEPENDS:=$(FB_DEPENDS)' package/kernel/linux/modules/video.mk

          # E87N backlight is active-low: max raw brightness means fully off.
          grep -Fq 'max * (100 - percent)' package/luci-app-display/root/usr/sbin/display-control
          sed -n '/^turn_off()/,/^}/p' package/luci-app-display/root/usr/sbin/display-control |
            grep -Fq 'set_brightness "$max"'

          # The LuCI package controls the source-built binary; no stale prebuilt copy remains.
          test ! -e package/luci-app-display/root/usr/sbin/display
          grep -Fq '+luci-base +display' package/luci-app-display/Makefile
          grep -q '^PKG_SOURCE_VERSION:=857574ae02dc11943f99423419e71556775977bd$' package/display/Makefile
          grep -q '^PKG_HASH:=7d9704c4f9365ddfb59c383cf625c1acc9725bd4c20670926434fa1992d958ff$' package/display/Makefile
          grep -Fq 'LV_BUILD_SET_CONFIG_OPTS OFF' package/display/patches/005-lvgl-avoid-runtime-pcpp.patch
          grep -Fq 'CONFIG_LV_USE_FREETYPE ON' package/display/patches/005-lvgl-avoid-runtime-pcpp.patch
          grep -Fq 'strcmp(name, "nvme")' package/display/patches/010-e87n-cyberpunk-nvme.patch
          grep -Fq 'ui_Screen1_set_nvme_visibility' package/display/patches/010-e87n-cyberpunk-nvme.patch
          grep -Fq 'LV_CHART_TYPE_LINE' package/display/patches/010-e87n-cyberpunk-nvme.patch

          # nlbwmon defaults to /var, which is volatile on this image. The
          # E87N first-boot setup moves only the untouched default to overlay.
          grep -Fq "database_directory=/etc/nlbwmon" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "grep -qxF '/etc/nlbwmon/' /etc/sysupgrade.conf" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults

          # Sequential DHCP leases cover every usable host address after .1.
          grep -Fq "dhcp.@dnsmasq[0].sequential_ip=1" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "dhcp.lan.start=2" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "dhcp.lan.limit=253" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults

          # AliDNS remains available even when there is no conventional WAN.
          grep -Fq "network.lan.dns='223.5.5.5'" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "network.lan.dns='223.6.6.6'" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "dhcp.@dnsmasq[0].noresolv=1" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "dhcp.@dnsmasq[0].server=223.5.5.5" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults
          grep -Fq "dhcp.@dnsmasq[0].server=223.6.6.6" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults

          # Pin modern Argon sources and force it as the only shipped theme.
          grep -q '^PKG_VERSION:=2.4.6$' package/luci-theme-argon/Makefile
          grep -q '^revision=86c3156bab0ee2b8c91af68b3fa4655f2df51d09$' package/luci-theme-argon/UPSTREAM
          grep -q '^revision=3e099a37c3f71d0de677f1b6b0f4bffd57d91dac$' package/luci-app-argon-config/UPSTREAM
          grep -Fq "luci.main.mediaurlbase=/luci-static/argon" target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-e87n-defaults

      - name: Verify pinned package toolchains
        run: |
          grep -q '^GO_DEFAULT_VERSION:=1.26$' feeds/packages/lang/golang/golang-values.mk
          grep -q '^GO_VERSION_PATCH:=5$' feeds/packages/lang/golang/golang1.26/Makefile
          grep -q '^PKG_VERSION:=1.96.0$' feeds/packages/lang/rust/Makefile
          grep -q '^PKG_VERSION:=1.4.7$' feeds/packages/admin/btop/Makefile
          grep -q '^PKG_VERSION:=26.8.12$' feeds/passwall_luci/luci-app-passwall/Makefile
          grep -q '^PKG_VERSION:=0.47.156$' feeds/openclash/luci-app-openclash/Makefile

      - name: Download sources
        run: |
          make download -j8
          find dl -type f -size -1024c -print -delete
          make download -j8

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" V=s 2>&1 | tee build.log; then
            make -j1 V=s 2>&1 | tee build-j1.log
          fi

      - name: Verify kernel and firmware contents
        shell: bash
        run: |
          set -euxo pipefail
          image_dir='bin/targets/mediatek/filogic'
          sysupgrade="$(find "$image_dir" -maxdepth 1 -type f -name '*edgepi*e87n*squashfs-sysupgrade.bin' -print -quit)"
          initramfs="$(find "$image_dir" -maxdepth 1 -type f -name '*edgepi*e87n*initramfs*' -print -quit)"
          test -n "$sysupgrade" && test -s "$sysupgrade"
          test -n "$initramfs" && test -s "$initramfs"

          manifest="$(find "$image_dir" -maxdepth 1 -type f -name '*edgepi*e87n.manifest' -print -quit)"
          test -n "$manifest" && test -s "$manifest"
          grep -q '^display ' "$manifest"
          grep -q '^luci-app-display ' "$manifest"
          grep -q '^luci-app-nlbwmon ' "$manifest"
          grep -q '^nlbwmon ' "$manifest"
          grep -q '^luci-app-samba4 ' "$manifest"
          grep -q '^samba4-server ' "$manifest"
          grep -q '^luci-app-ttyd ' "$manifest"
          grep -q '^luci-i18n-ttyd-zh-cn ' "$manifest"
          grep -q '^ttyd ' "$manifest"
          grep -q '^luci-app-argon-config ' "$manifest"
          grep -q '^luci-theme-argon ' "$manifest"
          grep -q '^openclash-core-meta ' "$manifest"
          ! grep -q '^luci-theme-bootstrap ' "$manifest"
          grep -q '^block-mount ' "$manifest"
          grep -q '^kmod-fs-ext4 ' "$manifest"
          grep -q '^kmod-backlight-pwm ' "$manifest"
          grep -q '^kmod-fb-tft-nv3007 ' "$manifest"
          grep -q '^kmod-nvme ' "$manifest"
          grep -q '^kmod-hwmon-core ' "$manifest"
          grep -q '^kmod-nft-offload ' "$manifest"

          kernel_config="$(find build_dir/target-aarch64_cortex-a53_musl -path '*/linux-mediatek_filogic/linux-6.18*/.config' -print -quit)"
          test -n "$kernel_config"
          grep -q '^CONFIG_FB_TFT_NV3007=m$' "$kernel_config"
          grep -q '^CONFIG_HWMON=m$' "$kernel_config"
          grep -q '^CONFIG_NVME_HWMON=y$' "$kernel_config"
          grep -q '^CONFIG_NF_FLOW_TABLE_HW=m$' "$kernel_config"
          grep -q '^CONFIG_NET_MEDIATEK_SOC=y$' "$kernel_config"

          realtek_source="$(find build_dir/target-aarch64_cortex-a53_musl -path '*/linux-6.18*/drivers/net/phy/realtek/realtek_main.c' -print -quit)"
          test -n "$realtek_source"
          grep -q 'RTL8221B_LED_LINK_SELECT' "$realtek_source"

          work="$RUNNER_TEMP/e87n-verify"
          mkdir -p "$work/sysupgrade" "$work/rootfs"
          tar -xf "$sysupgrade" -C "$work/sysupgrade"
          rootfs="$(find "$work/sysupgrade" -type f -name root -print -quit)"
          test -n "$rootfs"
          unsquashfs -d "$work/rootfs" "$rootfs" >/dev/null

          test -x "$work/rootfs/usr/sbin/display"
          test -x "$work/rootfs/usr/sbin/display-control"
          test -x "$work/rootfs/etc/init.d/display-control"
          test -x "$work/rootfs/usr/sbin/nlbwmon"
          test -x "$work/rootfs/etc/init.d/nlbwmon"
          test -f "$work/rootfs/etc/config/nlbwmon"
          test -x "$work/rootfs/usr/sbin/smbd"
          test -x "$work/rootfs/etc/init.d/samba4"
          test -f "$work/rootfs/etc/config/samba4"
          test -x "$work/rootfs/usr/bin/ttyd"
          test -x "$work/rootfs/etc/init.d/ttyd"
          test -f "$work/rootfs/etc/config/ttyd"
          test -f "$work/rootfs/www/luci-static/resources/view/ttyd/term.js"
          test -x "$work/rootfs/sbin/block"
          test -f "$work/rootfs/etc/config/argon"
          test -d "$work/rootfs/www/luci-static/argon"
          test ! -e "$work/rootfs/www/luci-static/bootstrap"
          test -x "$work/rootfs/usr/bin/fancontrol"
          test -x "$work/rootfs/etc/init.d/fancontrol"
          test -x "$work/rootfs/etc/openclash/core/clash_meta"
          test -x "$work/rootfs/usr/bin/btop"
          test -d "$work/rootfs/usr/share/openclash"
          test -d "$work/rootfs/usr/share/passwall"
          test -x "$work/rootfs/usr/bin/flock"
          test -x "$work/rootfs/usr/share/passwall/app.sh"
          test -x "$work/rootfs/etc/init.d/passwall"
          test -f "$work/rootfs/etc/hotplug.d/iface/98-passwall"
          echo "84f76677fdceddb375eab5f0abf4c1e060b14396406ddb4ed019d987280ba0dd  $work/rootfs/usr/share/passwall/app.sh" | sha256sum -c -
          echo "9391931ee634d14583e484b09261a073086b0543a20674cc18707562254e6c67  $work/rootfs/etc/init.d/passwall" | sha256sum -c -
          echo "a4a78482879696971aa754a9314caa35f50b63787358f17780afba7d1297aca6  $work/rootfs/etc/hotplug.d/iface/98-passwall" | sha256sum -c -
          grep -Fq 'CODEX_OFFLINE_ROOTFS_GUARD' "$work/rootfs/etc/init.d/passwall"
          grep -Fq 'CODEX_PASSWALL_IFUP_DEBOUNCE_V2' "$work/rootfs/etc/hotplug.d/iface/98-passwall"
          test -f "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -q "192.168.66.1" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -q "flow_offloading_hw='1'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -q "database_directory=/etc/nlbwmon" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "dhcp.@dnsmasq[0].sequential_ip=1" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "dhcp.lan.start=2" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "dhcp.lan.limit=253" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "network.lan.dns='223.5.5.5'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "network.lan.dns='223.6.6.6'" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "dhcp.@dnsmasq[0].server=223.5.5.5" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "dhcp.@dnsmasq[0].server=223.6.6.6" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          grep -Fq "luci.main.mediaurlbase=/luci-static/argon" "$work/rootfs/etc/uci-defaults/99-e87n-defaults"
          find "$work/rootfs/lib/modules" -name 'fb_nv3007.ko' -print -quit | grep -q .
          find "$work/rootfs/lib/modules" -name 'hwmon.ko' -print -quit | grep -q .
          find "$work/rootfs/lib/modules" -name 'nvme-core.ko' -print -quit | grep -q .
          find "$work/rootfs/lib/modules" -name 'nf_flow_table.ko' -print -quit | grep -q .

          file "$work/rootfs/usr/sbin/display" | grep -q 'ARM aarch64'
          strings "$work/rootfs/usr/sbin/display" | grep -q 'NVME0_TEMP'
          strings "$work/rootfs/usr/sbin/display" | grep -q '/sys/class/hwmon'
          file "$work/rootfs/etc/openclash/core/clash_meta" | grep -q 'ARM aarch64'

          {
            echo "sysupgrade=$sysupgrade"
            echo "initramfs=$initramfs"
            echo 'go=1.26.5'
            echo 'rust=1.96.0'
            echo 'btop=1.4.7'
            echo 'passwall=26.8.12'
            echo 'openclash=0.47.156'
            echo 'mihomo=1.19.29'
            echo 'nvme_hwmon=CONFIG_NVME_HWMON=y'
            echo 'display_source=Hiveton/hiveton-mt-lvgl-c@857574ae02dc11943f99423419e71556775977bd'
            sha256sum "$sysupgrade" "$initramfs"
          } | tee "$image_dir/e87n-verification.txt"

      - name: Upload E87N firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgepi-e87n-firmware-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            bin/targets/mediatek/filogic/*edgepi*e87n*
            bin/targets/mediatek/filogic/e87n-verification.txt
            bin/targets/mediatek/filogic/sha256sums
            build.log
            build-j1.log
            defconfig.log
